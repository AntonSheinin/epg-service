services:
  epg-service:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      EPG_SOURCES_FILE: /app/epg_sources.toml
    volumes:
      - type: bind
        source: ./config/epg_sources.toml
        target: /app/epg_sources.toml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
